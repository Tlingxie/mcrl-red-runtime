<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MCRL - real Minecraft PvP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="eyebrow">MINECRAFT / FROZEN RED DQN</div>
    <div class="headline">EMPTY-HAND ARENA <span id="live">LIVE SERVER</span></div>
    <div id="round">Connecting to the local server...</div>
  </header>
  <section id="red" class="card red"><h2>RedDQN</h2><div class="health"><i></i></div><div class="metrics"></div><div class="action"></div></section>
  <section id="blue" class="card blue"><h2>BlueDQN</h2><div class="health"><i></i></div><div class="metrics"></div><div class="action"></div></section>
  <div id="labels"></div>
  <footer><span>Java 1.20.4 / survival / vanilla reach + cooldown</span><span id="result">Real server entity positions and health</span></footer>
  <script src="index.js"></script>
  <script src="hud.js"></script>
</body>
</html>
